### ===== Model =====
model_name_or_path: /path/to/DeepSeek-R1-0528-Qwen3-8B
trust_remote_code: true

### ===== Training Method =====
stage: sft
do_train: true
finetuning_type: lora
template: deepseekr1
flash_attn: auto

### ===== Dataset =====
dataset_dir: ./data
dataset: fetal_mri_diagnosis_plus_kg
cutoff_len: 2048
preprocessing_num_workers: 16
packing: false
max_samples: 14000

### ===== Validation =====
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50

### ===== Training Hyperparameters =====
learning_rate: 2.0e-4
num_train_epochs: 3.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
lr_scheduler_type: cosine
warmup_steps: 10
max_grad_norm: 0.3
optim: adamw_torch

### ===== LoRA Parameters =====
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.0
loraplus_lr_ratio: 16
lora_target: all

### ===== Thinking Chain =====
enable_thinking: false

### ===== Save & Logging =====
output_dir: ./saves/fetal_mri_plus_kg_lora
logging_steps: 5
save_steps: 200
plot_loss: true

### ===== Precision =====
bf16: true

### ===== Misc =====
report_to: none
ddp_timeout: 180000000
include_num_input_tokens_seen: true
