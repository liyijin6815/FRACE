### Model
model_name_or_path: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
trust_remote_code: true

### Training method
stage: sft
do_train: true
finetuning_type: lora
template: deepseekr1
flash_attn: auto

### Dataset
dataset_dir: ./data
dataset: fetal_mri_diagnosis
cutoff_len: 2048
preprocessing_num_workers: 16
packing: false
max_samples: 14000

### Validation
val_size: 0.1
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100

### Optimization
learning_rate: 2.0e-4
num_train_epochs: 4.0
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
lr_scheduler_type: cosine
warmup_steps: 0
max_grad_norm: 0.3
optim: adamw_torch

### LoRA
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
loraplus_lr_ratio: 16
lora_target: all

### Generation behavior
enable_thinking: false

### Output and precision
output_dir: ./outputs/fetal_mri_lora
logging_steps: 5
save_steps: 100
plot_loss: true
bf16: true
report_to: none
ddp_timeout: 180000000
include_num_input_tokens_seen: true
