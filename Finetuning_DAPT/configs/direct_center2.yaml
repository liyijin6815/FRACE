### Base model and direct-SFT adapter
model_name_or_path: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
adapter_name_or_path: ../Finetuning/adapter/fetal_mri_lora
trust_remote_code: true

### DAPT method
stage: pt
do_train: true
finetuning_type: lora
create_new_adapter: true
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### Target-center corpus with source replay
dataset_dir: ./data
dataset: center2_pt_corpus_replay
template: deepseekr1
cutoff_len: 512
packing: false
overwrite_cache: true
preprocessing_num_workers: 8

### Output
output_dir: ./outputs/direct/center2
logging_steps: 1
save_strategy: steps
save_steps: 10
plot_loss: true
overwrite_output_dir: true

### Optimization
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 6.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Validation
val_size: 0.05
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 4
